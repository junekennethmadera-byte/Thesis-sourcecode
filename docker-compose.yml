services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: edata_banking
      POSTGRES_USER: edata_app
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in the deployment environment}
    volumes:
      - edata-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U edata_app -d edata_banking"]
      interval: 5s
      timeout: 5s
      retries: 12

  app:
    build: .
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql://edata_app:${POSTGRES_PASSWORD}@db:5432/edata_banking
      NODE_ENV: production
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "${PORT:-8000}:8000"

volumes:
  edata-postgres:
